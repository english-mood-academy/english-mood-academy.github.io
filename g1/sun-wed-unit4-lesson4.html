function card(x){const s=x.ex.map((e,k)=>`<div class="s">${e.replace(new RegExp('\\b('+x.k+'\\w*)\\b','i'),'<b>$1</b>')} <button class="au" onclick="play('${x.ea[k]}')">🔊</button><button class="au sl" onclick="play('${x.es[k]}')">🐢</button></div>`).join('');
return `<div class="card"><img src="${x.img}" alt="${x.w}"><div class="w">${x.w}</div><div class="ar">${x.a}</div>
<button class="au" onclick="play('${x.au}')">🔊</button><button class="au sl" onclick="play('${x.aus}')">🐢</button>
${s}</div>`}
function gcard(x){return `<div class="card"><div class="w" style="font-size:1.6rem">${x.t}</div><div class="ar">${x.a}</div>${x.ex.map((e,k)=>`<div class="s">${e} <button class="au" onclick="play('${x.ea[k]}')">🔊</button></div>`).join('')}</div>`}
g.innerHTML=D.words.map(card).join('');p.innerHTML=D.gram.map(gcard).join('');
const F=D.words;let i=0;
function show(){const x=F[i];fl.classList.remove('f');fi.src=x.img;fi.alt=x.w;fw.textContent=x.w;fa.textContent=x.a;fs.textContent=x.ex[0]||"";
fx1.onclick=e=>{e.stopPropagation();play(x.au)};fx2.onclick=e=>{e.stopPropagation();play(x.aus)};fn.textContent=(i+1)+' / '+F.length}
function go(d){i=(i+d+F.length)%F.length;show()}
function mode(m){dict.style.display=m?'none':'';document.getElementById('fc').style.display=m?'block':'none';b1.className=m?'':'on';b2.className=m?'on':'';if(m)show()}
