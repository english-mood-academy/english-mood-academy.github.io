<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141a3a">
<title>Sec.2 Unit4 Lesson1 · Escape the Waste Lab!</title>
<style>
:root{--ink:#1d2340;--brand:#2f4bd8;--brand2:#6a3fd8;--gold:#ffd23f;--ok:#1fa463;--bad:#d64545;--ar:#0f6b4f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:#fff;background:#141a3a;line-height:1.45;-webkit-text-size-adjust:100%;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:body{background:linear-gradient(135deg,#102d2b,#244c42)};transition:filter 1s}
body.stormy::before{filter:brightness(.6) saturate(.7)}
body.flash::after{content:"";position:fixed;inset:0;background:#fff;opacity:.0;animation:flash .5s;pointer-events:none;z-index:50}
@keyframes flash{0%{opacity:.0}10%{opacity:.55}20%{opacity:.05}30%{opacity:.35}100%{opacity:0}}
.arf{font-family:"Noto Naskh Arabic","Noto Sans Arabic","Geeza Pro","Segoe UI",Tahoma,Arial,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:12px 12px calc(24px + env(safe-area-inset-bottom))}
.screen{display:none}.screen.on{display:block}
.btn{appearance:none;-webkit-appearance:none;border:0;border-radius:16px;min-height:52px;padding:0 20px;font-size:1.08rem;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#fff;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.25);font-family:inherit;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.go{background:linear-gradient(180deg,#ffe066,#ffb703);color:#3a2600}
.btn.blue{background:linear-gradient(180deg,#5b7bff,#2f4bd8);color:#fff}
.btn.ghost{background:rgba(255,255,255,.14);color:#fff;box-shadow:none}
.btn:disabled{opacity:.35;cursor:default}
.big{width:100%;font-size:1.25rem;min-height:60px}
/* start */
.hero{text-align:center;padding:26px 6px 10px}
.hero .storm{font-size:4.5rem;line-height:1;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
.hero h1{margin:8px 0 2px;font-size:2.2rem;letter-spacing:.5px;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.hero .sub{color:var(--gold);font-weight:800}
.panel{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:14px 16px;margin:14px 0}
.panel p{margin:6px 0}
.rtl{direction:rtl;text-align:right}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;font-size:.95rem}
.rules div{background:rgba(255,255,255,.08);border-radius:12px;padding:8px 10px}
input[type=text]{width:100%;min-height:52px;border-radius:14px;border:3px solid #cfd5ee;padding:0 14px;font-size:1.15rem;font-family:inherit;color:var(--ink);background:#fff;outline:none}
input[type=text]:focus{border-color:var(--gold)}
label.l{display:block;font-weight:700;margin:4px 0 6px}
/* hud */
.hud{position:sticky;top:0;z-index:20;background:rgba(14,19,48,.92);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:8px 12px calc(8px);padding-top:calc(8px + env(safe-area-inset-top));border-bottom:1px solid rgba(255,255,255,.12)}
.hud .row{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:8px}
.pill{background:rgba(255,255,255,.12);border-radius:999px;padding:6px 12px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;border:0;color:#fff;font-size:1rem;font-family:inherit;min-height:40px;display:inline-flex;align-items:center;gap:6px}
button.pill{cursor:pointer}
.meter{flex:1 1 auto;height:12px;background:rgba(255,255,255,.15);border-radius:999px;overflow:hidden;position:relative}
.meter i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#7bdcff,#ffb703,#ff4d4d);border-radius:999px;transition:width .5s linear}
.codebar{max-width:640px;margin:8px auto 0;display:flex;justify-content:center;gap:6px}
.slot{width:38px;height:44px;border-radius:10px;background:rgba(255,255,255,.1);border:2px dashed rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:900;color:var(--gold)}
.slot.got{border-style:solid;border-color:var(--gold);background:rgba(255,210,63,.15);animation:pop .5s}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
/* map */
.map{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.node{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.12);border-radius:18px;padding:10px 12px;color:#fff;font:inherit;text-align:left;width:100%}
.node .em{font-size:2rem;width:52px;height:52px;border-radius:14px;background:rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.node .t{flex:1 1 auto}.node .t b{display:block;font-size:1.08rem}.node .t span{font-size:.85rem;opacity:.8}
.node .st{font-size:1.5rem;flex:0 0 auto}
.node.done{border-color:rgba(31,164,99,.7);background:rgba(31,164,99,.15)}
.node.cur{border-color:var(--gold);background:rgba(255,210,63,.14);cursor:pointer;animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px rgba(255,210,63,.18)}}
.node.lock{opacity:.5}
/* room */
.roomhead{display:flex;align-items:center;gap:12px;margin:12px 0 4px}
.roomhead .em{font-size:2.8rem;animation:bob 3s ease-in-out infinite}
.roomhead h2{margin:0;font-size:1.4rem}
.roomhead .rn{color:var(--gold);font-weight:800;font-size:.85rem;letter-spacing:.6px}
.story{opacity:.9;margin:4px 0}
.pips{display:flex;gap:6px;margin:8px 0}
.pip{flex:1 1 0;height:8px;border-radius:999px;background:rgba(255,255,255,.15)}
.pip.ok{background:var(--ok)}.pip.cur{background:var(--gold)}
.card{background:#fff;color:var(--ink);border-radius:22px;padding:18px 16px;box-shadow:0 10px 30px rgba(0,0,0,.35);margin:10px 0;position:relative}
.card.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.card.good{box-shadow:0 0 0 5px var(--ok),0 10px 30px rgba(0,0,0,.35)}
.q-lbl{font-size:.8rem;font-weight:800;color:#6a72a0;letter-spacing:.5px;text-transform:uppercase}
.q{font-size:1.3rem;font-weight:700;margin:6px 0 14px;line-height:1.45}
.q.arq{font-size:2rem;text-align:center;color:var(--ar);direction:rtl}
.q .blank{display:inline-block;min-width:90px;border-bottom:4px solid var(--brand);margin:0 4px}
.q .base{color:#c2334d;white-space:nowrap}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{appearance:none;-webkit-appearance:none;border:3px solid #d8ddf3;background:#f6f7fd;border-radius:16px;min-height:60px;padding:8px;font-size:1.12rem;font-weight:800;color:var(--ink);cursor:pointer;font-family:inherit;transition:background .15s,border-color .15s}
.opt:active{transform:scale(.97)}
.opt.ok{background:#dcf5e8;border-color:var(--ok)}
.opt.bad{background:#fde3e3;border-color:var(--bad)}
.opt:disabled{opacity:.3}
.opt.ok:disabled{opacity:1}
.clue{background:#eaf7f1;border-radius:12px;padding:8px 12px;color:var(--ar);font-weight:700;margin-bottom:10px}
.clue .en{color:#36406b;font-weight:500;display:block;direction:ltr;text-align:left;font-size:.95rem}
.ans{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:56px;margin:6px 0 14px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{width:46px;height:52px;border-radius:12px;border:0;background:linear-gradient(180deg,#ffe066,#ffb703);color:#3a2600;font-size:1.5rem;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #c78a00;font-family:inherit;text-transform:lowercase}
.tile:disabled{visibility:hidden}
.aslot{width:42px;height:50px;border-radius:10px;border:3px dashed #c8cee8;display:flex;align-items:center;justify-content:center;font-size:1.45rem;font-weight:900;color:var(--ink);cursor:pointer;background:#f6f7fd}
.aslot.f{border-style:solid;border-color:var(--brand)}
.ans.long{gap:4px}.ans.long .aslot{width:32px;height:44px;font-size:1.2rem;border-width:2px}
.tiles.long{gap:6px}.tiles.long .tile{width:40px;height:48px;font-size:1.3rem}
.aslot.fixed{border-color:var(--ok);background:#dcf5e8}
.listen{display:flex;gap:10px;justify-content:center;margin:4px 0 14px}
.listen .btn{min-width:120px}
.typerow{display:flex;gap:8px}
.typerow input{flex:1 1 auto;text-align:center;font-size:1.4rem;font-weight:800}
.hintmsg{margin:10px 0 0;color:#6a3fd8;font-weight:700;text-align:center;min-height:1.2em}
.fb{min-height:1.4em;text-align:center;font-weight:800;margin-top:10px}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
/* overlay */
.ov{position:fixed;inset:0;z-index:40;background:rgba(8,10,30,.78);display:none;align-items:center;justify-content:center;padding:20px}
.ov.on{display:flex}
.ov .box{background:#fff;color:var(--ink);border-radius:24px;padding:22px 18px;max-width:420px;width:100%;text-align:center;animation:pop .45s}
.ov .lk{font-size:3.4rem}
.ov h3{margin:6px 0;font-size:1.5rem}
.ov .letter{display:inline-flex;width:76px;height:86px;border-radius:18px;align-items:center;justify-content:center;font-size:3rem;font-weight:900;background:linear-gradient(180deg,#ffe066,#ffb703);color:#3a2600;margin:8px 0 14px;box-shadow:0 6px 0 #c78a00}
/* win */
.cert{background:linear-gradient(160deg,#fffbea,#fff);color:var(--ink);border-radius:24px;padding:22px 18px;text-align:center;border:6px solid var(--gold);box-shadow:0 12px 40px rgba(0,0,0,.4);margin:12px 0;position:relative;overflow:hidden}
.cert .tr{font-size:3.4rem}
.cert h2{margin:4px 0;font-size:2rem;color:#1e2a5a}
.cert .nm{font-size:1.8rem;font-weight:900;color:#6a3fd8;margin:8px 0;min-height:1.3em;word-break:break-word}
.cert .stars{font-size:2rem;letter-spacing:4px}
.cert .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.cert .stats div{background:#f3f5fb;border-radius:12px;padding:8px 4px}
.cert .stats b{display:block;font-size:1.3rem}
.cert .stats span{font-size:.8rem;color:#5b6385}
.cert .meta{color:#5b6385;font-size:.9rem}
.confetti{position:fixed;top:-40px;font-size:1.6rem;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.small{font-size:.85rem;opacity:.8;text-align:center}
</style>
</head>
<body>
<!-- START -->
<section class="screen on" id="sStart"><div class="wrap">
  <div class="hero">
    <div class="storm" id="heroEm"></div>
    <h1 id="heroT"></h1>
    <div class="sub" id="heroSub"></div>
  </div>
  <div class="panel">
    <p id="introEn"></p>
    <p class="rtl arf" id="introAr"></p>
    <div class="rules">
      <div>⏱️ The clock is running</div><div>❌ Wrong answer = +10 sec</div>
      <div>💡 Only 3 hints</div><div>🔤 6 letters = 1 code</div>
    </div>
  </div>
  <label class="l" for="nameIn">Your name · اسمك</label>
  <input type="text" id="nameIn" maxlength="30" autocomplete="off" placeholder="Write your name">
  <div style="height:14px"></div>
  <button class="btn go big" id="startBtn" type="button">🚀 Start the game</button>
  <p class="small" id="best"></p>
</div></section>

<!-- GAME -->
<section class="screen" id="sGame">
  <div class="hud">
    <div class="row">
      <span class="pill" id="timer">⏱ 0:00</span>
      <div class="meter" id="meterBox"><i id="meter"></i></div><span aria-hidden="true" id="meterEm"></span>
      <button class="pill" id="hintBtn" type="button">💡 <span id="hintN">3</span></button>
      <button class="pill" id="muteBtn" type="button" aria-label="Sound on/off">🔊</button>
    </div>
    <div class="codebar" id="codebar"></div>
  </div>
  <div class="wrap">
    <div id="mapView">
      <div class="panel" style="text-align:center;margin-bottom:4px"><b id="mapMsg">Choose the glowing room!</b><div class="arf rtl" id="mapMsgAr" style="text-align:center">اضغط على الغرفة المضيئة لتبدأ</div></div>
      <div class="map" id="map"></div>
    </div>
    <div id="roomView" style="display:none">
      <div class="roomhead"><div class="em" id="rEm"></div><div><div class="rn" id="rNum"></div><h2 id="rName"></h2></div></div>
      <p class="story" id="rStory"></p>
      <p class="story rtl arf" id="rAr"></p>
      <div class="pips" id="pips"></div>
      <div class="card" id="card"></div>
    </div>
  </div>
</section>

<!-- WIN -->
<section class="screen" id="sWin"><div class="wrap">
  <div class="cert" id="cert">
    <div class="tr">🏆</div>
    <h2>You escaped!</h2>
    <div style="font-weight:700" id="winLine"></div>
    <div class="nm" id="cName"></div>
    <div class="stars" id="cStars"></div>
    <div class="stats">
      <div><b id="cTime"></b><span>time ⏱</span></div>
      <div><b id="cMis"></b><span>mistakes ❌</span></div>
      <div><b id="cHints"></b><span>hints 💡</span></div>
    </div>
    <div class="meta"><span id="metaL"></span><br>English Mood Academy · <span id="cDate"></span></div>
  </div>
  <label class="l" for="nameWin">Your name · اكتب اسمك</label>
  <input type="text" id="nameWin" maxlength="30" autocomplete="off" placeholder="Write your name">
  <div class="panel rtl arf" style="text-align:center">📸 اكتب اسمك، ثم خذ لقطة شاشة (Screenshot) وأرسلها للمستر!</div>
  <button class="btn go big" id="againBtn" type="button">↺ Play again (new puzzles)</button>
</div></section>

<div class="ov" id="ov"><div class="box" id="ovBox"></div></div>

<script>
const DATA = {"items": {"0": {"i": 0, "w": "confusion", "ar": "التباس - ارتباك", "def": "the state of being unable to understand something clearly", "ex": "Different dates on food packages can cause confusion.", "pos": "n."}, "1": {"i": 1, "w": "generosity", "ar": "كرم", "def": "being kind and willing to give to others", "ex": "The family's generosity helped their neighbors.", "pos": "n."}, "2": {"i": 2, "w": "leftover", "ar": "طعام متبقٍ", "def": "food that remains uneaten after a meal", "ex": "She put the leftover in a suitable container.", "pos": "n."}, "3": {"i": 3, "w": "storage", "ar": "تخزين", "def": "keeping things safely until they are needed", "ex": "Correct storage helps protect food.", "pos": "n."}, "4": {"i": 4, "w": "recommendation", "ar": "توصية - اقتراح", "def": "an idea or suggestion about what someone should do", "ex": "The report made a recommendation to improve planning.", "pos": "n."}, "5": {"i": 5, "w": "reduce", "ar": "يقلل - يخفض", "def": "to make something smaller or less", "ex": "Smaller shopping lists can help reduce waste.", "pos": "v."}, "6": {"i": 6, "w": "significantly", "ar": "بشكل ملحوظ", "def": "in an important or noticeable way", "ex": "The amount of wasted bread fell significantly.", "pos": "adv."}, "8": {"i": 8, "w": "amount", "ar": "كمية", "def": "a quantity of something", "ex": "We measured the amount of bread left after lunch.", "pos": "n."}, "9": {"i": 9, "w": "awareness", "ar": "وعي", "def": "knowledge or understanding of a situation", "ex": "The campaign raised awareness of food waste.", "pos": "n."}, "11": {"i": 11, "w": "cause", "ar": "سبب", "def": "something that makes another thing happen", "ex": "Poor planning is one cause of waste.", "pos": "n."}, "13": {"i": 13, "w": "consumer", "ar": "مستهلك", "def": "a person who buys or uses goods or services", "ex": "A careful consumer reads the label.", "pos": "n."}, "19": {"i": 19, "w": "fresh", "ar": "طازج", "def": "recently produced or picked and not spoiled", "ex": "We bough     b.className = 'node ' + st;
    b.innerHTML = '<div class="em"></div><div class="t"><b></b><span></span></div><div class="st"></div>';
    b.querySelector('.em').textContent = r.em; b.querySelector('b').textContent = (k < 6 ? 'Room ' + (k + 1) + ': ' : 'Final: ') + r.name;
    b.querySelector('span').textContent = k < 6 ? (st === 'done' ? 'Solved! Letter: ' + S.got[k] : r.n + ' puzzles') : 'Needs the 6-letter code';
    b.querySelector('.st').textContent = st === 'done' ? '✅' : st === 'cur' ? '▶' : '🔒';
    if (st !== 'cur') b.disabled = true; else b.onclick = () => { sfx.tap(); openRoom(); };
    m.appendChild(b);
  });
  $('mapMsg').textContent = S.room === 0 ? 'Choose the glowing room!' : S.room < 6 ? 'Great! Next room is open.' : THEME.mapDone[0];
  $('mapMsgAr').textContent = S.room === 0 ? 'اضغط على الغرفة المضيئة لتبدأ' : S.room < 6 ? 'رائع! الغرفة التالية مفتوحة.' : THEME.mapDone[1];
}

// ---------- rooms ----------
let hintFn = null, locked = false;
function openRoom(){
  $('mapView').style.display = 'none'; $('roomView').style.display = '';
  const final = S.room === 6, r = final ? FINAL : ROOMS[S.room];
  $('rEm').textContent = r.em; $('rName').textContent = r.name;
  $('rNum').textContent = final ? 'FINAL DOOR' : 'ROOM ' + (S.room + 1) + ' OF 6';
  $('rStory').textContent = final ? THEME.finalStory[0] : r.story;
  $('rAr').textContent = final ? THEME.finalStory[1] : r.ar;
  window.scrollTo(0, 0);
  final ? renderFinal() : renderQ();
}
function pips(){
  const p = $('pips'); p.innerHTML = ''; if (S.room >= 6) return;
  for (let k = 0; k < ROOMS[S.room].n; k++) { const d = document.createElement('div'); d.className = 'pip' + (k < S.q ? ' ok' : k === S.q ? ' cur' : ''); p.appendChild(d); }
}
function card(html){ const c = $('card'); c.className = 'card'; c.innerHTML = html; locked = false; return c; }
function wrong(c, fbText){
  S.mis++; S.pen += PENALTY; sfx.bad(); hud();
  c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake');
  const f = c.querySelector('.fb'); if (f) { f.className = 'fb bad'; f.textContent = fbText || '❌ Not this one! +' + PENALTY + ' sec'; }
}
function right(c, then){
  locked = true; sfx.ok(); c.classList.add('good');
  const f = c.querySelector('.fb'); if (f) { f.className = 'fb ok'; f.textContent = ['✅ Correct!', '✅ Great job!', '✅ Well done!', '✅ Super!'][rnd(4)]; }
  if (then) then();
  setTimeout(() => { S.q++; if (S.q >= ROOMS[S.room].n) roomSolved(); else renderQ(); }, 1300);
}
function mcq(c, opts, correct, label, onRight){
  const box = c.querySelector('.opts');
  opts.forEach(o => { const b = document.createElement('button'); b.type = 'button'; b.className = 'opt'; b.lang = 'en'; b.textContent = label(o); b.dataset.o = o;
    b.onclick = () => { if (locked || b.disabled) return; if (o == correct) { b.classList.add('ok'); right(c, onRight); } else { b.classList.add('bad'); b.disabled = true; wrong(c); } };
    box.appendChild(b); });
  hintFn = () => { const bad = [...box.children].filter(b => b.dataset.o != correct && !b.disabled); if (bad.length < 2) return false; shuffle(bad).slice(0, 2).forEach(b => b.disabled = true); return 'Two wrong answers are gone!'; };
}
function renderQ(){
  pips(); const r = ROOMS[S.room], Q = S.qs[S.room][S.q];
  if (r.id === 'def') {
    const c = card('<div class="q-lbl">Clue ' + (S.q + 1) + '</div><div class="q" lang="en"></div><div class="opts"></div><div class="fb"></div><div class="hintmsg"></div>');
    c.querySelector('.q').textContent = '“' + I(Q.t).def + '”';
    mcq(c, Q.opts, Q.t, o => I(o).w, () => sayWord(Q.t));
  } else if (r.id === 'ar') {
    const c = card('<div class="q-lbl">What is this in English?</div><div class="q arq arf" lang="ar"></div><div class="opts"></div><div class="fb"></div><div class="hintmsg"></div>');
    c.querySelector('.q').textContent = I(Q.t).ar;
    mcq(c, Q.opts, Q.t, o => I(o).w, () => sayWord(Q.t));
  } else if (r.id === 'gap') {
    const G = DATA.GAP[Q.k], ans = I(G.i).w;
    const c = card('<div class="q-lbl">' + (r.qlbl || '📻 Broken message') + '</div><div class="q" lang="en"></div><div class="opts"></div><div class="fb"></div><div class="hintmsg"></div>');
    c.querySelector('.q').innerHTML = esc(G.s).replace('___', '<span class="blank"></span>');
    mcq(c, Q.opts, ans, o => o, () => { const bl = c.querySelector('.blank'); bl.textContent = ans; bl.style.color = 'var(--ok)'; sayWord(G.i); });
  } else if (r.id === 'gram') {
    const P = DATA.GRAM[Q.k];
    const c = card('<div class="q-lbl">' + (r.qlbl || '⏳ Grammar') + '</div><div class="q" lang="en"></div><div class="opts"></div><div class="fb"></div><div class="hintmsg"></div>');
    c.querySelector('.q').innerHTML = esc(P.s).replace('___', '<span class="blank"></span>') + (P.b ? ' <span class="base">(' + esc(P.b) + ')</span>' : '');
    mcq(c, Q.opts, P.a, o => o, () => { const bl = c.querySelector('.blank'); bl.textContent = P.a; bl.style.color = 'var(--ok)'; say(GRAMAUD[Q.k], P.say); });
  } else if (r.id === 'scr') renderScr(Q, r);
  else renderLis(Q, r);
}
function renderScr(Q, r){
  const it = I(Q.t), w = it.w.toLowerCase();
  const c = card('<div class="q-lbl">' + ((r && r.qlbl) || '🔤 Mixed-up word') + '</div><div class="clue arf" dir="rtl"><span class="a"></span><span class="en" lang="en"></span></div><div class="ans"></div><div class="tiles"></div><div class="fb"></div><div class="hintmsg"></div>');
  c.querySelector('.clue .a').textContent = it.ar; c.querySelector('.clue .en').textContent = it.def;
  const ans = c.querySelector('.ans'), tiles = c.querySelector('.tiles');
  if (w.length > 7) { ans.classList.add('long'); tiles.classList.add('long'); }
  let slots = Array(w.length).fill(null), fixed = 0;   // slots hold tile indexes
  const tb = Q.letters.map((L, k) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'tile'; b.textContent = L; b.onclick = () => place(k); tiles.appendChild(b); return b; });
  function draw(){
    ans.innerHTML = '';
    slots.forEach((t, k) => { const s = document.createElement('div'); s.className = 'aslot' + (t !== null ? ' f' : '') + (k < fixed ? ' fixed' : ''); s.textContent = t !== null ? Q.letters[t] : '';
      s.onclick = () => { if (locked || t === null || k < fixed) return; slots[k] = null; tb[t].disabled = false; draw(); }; ans.appendChild(s); });
    tb.forEach((b, k) => b.disabled = slots.includes(k));
  }
  function place(k){
    if (locked) return; sfx.tap();
    const e = slots.indexOf(null); if (e < 0) return; slots[e] = k; draw();
    if (!slots.includes(null)) {
      if (slots.map(t => Q.letters[t]).join('') === w) right(c, () => sayWord(Q.t));
      else { wrong(c, '❌ Not yet! Try again. +' + PENALTY + ' sec'); setTimeout(() => { for (let j = fixed; j < slots.length; j++) slots[j] = null; draw(); }, 600); }
    }
  }
  hintFn = () => {
    if (fixed >= w.length - 1) return false;
    const target = Math.min(fixed + 2, w.length - 1);
    for (let j = fixed; j < slots.length; j++) slots[j] = null;
    const used = new Set(slots.slice(0, fixed));
    for (let j = fixed; j < target; j++) { const t = Q.letters.findIndex((L, k) => L === w[j] && !used.has(k)); slots[j] = t; used.add(t); }
    fixed = target; draw(); return 'The first ' + fixed + ' letters are in place!';
  };
  draw();
}
function renderLis(Q){
  const it = I(Q.t);
  const c = card('<div class="q-lbl">🎧 Secret word ' + (S.q + 1) + '</div><div class="listen"><button class="btn blue" type="button" id="pl">🔊 Play</button><button class="btn" type="button" id="ps" style="background:#eef0f8">🐢 Slow</button></div><div class="typerow"><input type="text" id="tin" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="type the word" lang="en"><button class="btn go" type="button" id="chk">✔</button></div><div class="fb"></div><div class="hintmsg"></div>');
  $('pl').onclick = () => sayWord(Q.t); $('ps').onclick = () => sayWord(Q.t, true);
  const inp = $('tin');
  const check = () => { if (locked) return; const v = norm(inp.value); if (!v) { inp.focus(); return; }
    if (v === norm(it.w)) { inp.style.borderColor = 'var(--ok)'; inp.blur(); right(c); } else { wrong(c, '❌ Listen again! +' + PENALTY + ' sec'); inp.select(); } };
  $('chk').onclick = check; inp.onkeydown = e => { if (e.key === 'Enter') check(); };
  hintFn = () => 'It starts with “' + it.w[0] + '” · ' + it.w.length + ' letters · ' + it.ar;
  setTimeout(() => sayWord(Q.t), 350);
}
function roomSolved(){
  const k = S.room, letter = CODE[S.perm[k]];
  S.got[k] = letter; S.room++; S.q = 0; codebar(); sfx.unlock();
  overlay('<div class="lk">🔓</div><h3>Room ' + (k + 1) + ' unlocked!</h3><div>You found a secret letter:</div><div class="letter">' + letter + '</div><div class="arf" dir="rtl" style="margin-bottom:12px">وجدت حرفًا سريًا! احتفظ به للباب الأخير.</div>' +
    '<button class="btn go big" type="button" id="ovGo">' + (S.room < 6 ? 'Next room ▶' : 'To the ' + FINAL.name.replace(/^The /, '') + ' ' + FINAL.em) + '</button>');
  $('ovGo').onclick = () => { closeOv(); renderMap(); window.scrollTo(0, 0); if (S.room === 6) thunder(); };
}
// ---------- final door ----------
function renderFinal(){
  $('pips').innerHTML = '';
  const letters = S.got.slice();
  const c = card('<div class="q-lbl">🚪 The code</div><div class="clue arf" dir="rtl">الكلمة معناها: <b>' + esc(THEME.codeAr) + '</b><span class="en" lang="en">' + esc(THEME.codeClue) + '</span></div><div class="ans"></div><div class="tiles"></div><div class="fb"></div><div class="hintmsg"></div>');
  const ans = c.querySelector('.ans'), tiles = c.querySelector('.tiles');
  let slots = Array(6).fill(null), fixed = 0;
  const tb = letters.map((L, k) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'tile'; b.style.textTransform = 'uppercase'; b.textContent = L; b.onclick = () => place(k); tiles.appendChild(b); return b; });
  function draw(){ ans.innerHTML = ''; slots.forEach((t, k) => { const s = document.createElement('div'); s.className = 'aslot' + (t !== null ? ' f' : '') + (k < fixed ? ' fixed' : ''); s.textContent = t !== null ? letters[t] : '';
      s.onclick = () => { if (locked || t === null || k < fixed) return; slots[k] = null; draw(); }; ans.appendChild(s); }); tb.forEach((b, k) => b.disabled = slots.includes(k)); }
  function place(k){ if (locked) return; sfx.tap(); const e = slots.indexOf(null); if (e < 0) return; slots[e] = k; draw();
    if (!slots.includes(null)) { if (slots.map(t => letters[t]).join('') === CODE) { locked = true; c.classList.add('good'); win(); }
      else { wrong(c, '❌ The door is still locked! +' + PENALTY + ' sec'); setTimeout(() => { for (let j = fixed; j < 6; j++) slots[j] = null; draw(); }, 600); } } }
  hintFn = () => { if (fixed >= 4) return false; const target = fixed + 2; for (let j = fixed; j < 6; j++) slots[j] = null;
    const used = new Set(slots.slice(0, fixed)); for (let j = fixed; j < target; j++) { const t = letters.findIndex((L, k) => L === CODE[j] && !used.has(k)); slots[j] = t; used.add(t); } fixed = target; draw(); return 'The first ' + fixed + ' letters are in place!'; };
  draw();
}
// ---------- hints / overlay / toast ----------
$('hintBtn').onclick = () => {
  if (S.hints <= 0 || !hintFn || locked || $('roomView').style.display === 'none') { if ($('roomView').style.display === 'none') toast('Open a room first!', 'افتح غرفة أولًا'); return; }
  const m = hintFn(); if (!m) { toast('No more hints for this puzzle.', 'لا توجد مساعدة أخرى لهذا اللغز'); return; }
  S.hints--; S.used++; hud(); sfx.tap(); const h = $('card').querySelector('.hintmsg'); if (h) h.textContent = '💡 ' + m;
};
function overlay(html){ $('ovBox').innerHTML = html; $('ov').classList.add('on'); }
function closeOv(){ $('ov').classList.remove('on'); }
function toast(en, ar){ overlay('<div class="lk">💬</div><h3>' + esc(en) + '</h3><div class="arf" dir="rtl" style="margin-bottom:12px">' + esc(ar) + '</div><button class="btn blue big" type="button" id="ovOk">OK</button>'); $('ovOk').onclick = closeOv; }
// ---------- win ----------
function win(){
  S.done = true; clearInterval(tick); const t = elapsed(); S.final = t;
  setTimeout(() => {
    sfx.win(); show('sWin');
    const stars = (S.mis <= 2 && S.used <= 1) ? 3 : (S.mis <= 6 ? 2 : 1);
    $('cStars').textContent = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
    $('cTime').textContent = fmt(t); $('cMis').textContent = S.mis; $('cHints').textContent = S.used + ' / ' + HINTS;
    $('cDate').textContent = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    $('nameWin').value = $('nameIn').value.trim(); setName();
    const b = +load('best') || 0; if (!b || t < b) store('best', t);
    for (let k = 0; k < 40; k++) { const e = document.createElement('div'); e.className = 'confetti'; e.textContent = THEME.confetti[rnd(THEME.confetti.length)]; e.style.left = rnd(100) + 'vw'; e.style.animationDuration = (2.5 + Math.random() * 2.5) + 's'; e.style.animationDelay = Math.random() * 1.2 + 's'; document.body.appendChild(e); setTimeout(() => e.remove(), 7000); }
  }, 700);
}
function setName(){ const n = $('nameWin').value.trim(); $('cName').textContent = n || '✍️ your name'; store('name', n); }
$('nameWin').oninput = setName;
// ---------- start ----------
$('nameIn').value = load('name') || '';
const best = +load('best'); if (best) $('best').textContent = '🏅 Your best time: ' + fmt(best);
function start(){
  ctx(); store('name', $('nameIn').value.trim());
  newGame(); document.body.classList.remove('stormy'); codebar(); show('sGame'); renderMap(); hud();
  clearInterval(tick); tick = setInterval(() => { if (!S.done) hud(); }, 500);
  thunder();
}
$('startBtn').onclick = start;
$('againBtn').onclick = () => { $('nameIn').value = $('nameWin').value; start(); };
</script>
</body>
